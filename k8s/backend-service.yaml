apiVersion: v1
kind: Service
metadata:
  name: patient-api-service
  namespace: default
  labels:
    app: patient-api
    component: backend
spec:
  selector:
    app: patient-api
    component: backend
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  type: ClusterIP
